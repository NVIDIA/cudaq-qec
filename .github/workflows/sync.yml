on:
  workflow_dispatch:
  schedule:
    - cron: 0 1 * * *

name: "Sync with upstream repository"

jobs:
  sync:
    name: Get Updates from Upstream
    if: ${{ startsWith(github.repository, 'NVIDIA/cudaq-qec') && github.repository != 'NVIDIA/cudaq-qec' }}
    runs-on: 'ubuntu-latest'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}

    - name: Fast-forward ${{ github.ref_name }}
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git remote add upstream https://github.com/NVIDIA/cudaq-qec
        # LFS objects are stored per repository and are not mirrored by a git
        # push, so pull without smudging (the objects referenced by new
        # upstream commits may not exist in this repository's LFS storage
        # yet), fetch them from upstream, and let the push upload them.
        GIT_LFS_SKIP_SMUDGE=1 git pull --ff-only upstream ${{ github.ref_name }}
        git -c http.https://github.com/.extraheader= lfs fetch upstream ${{ github.ref_name }}
        git push origin
