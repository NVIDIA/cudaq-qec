name: QEC lib

on:
  workflow_call:
    inputs:
      cache_key_suffix:
        type: string
        default: ''
        required: false
      cudaq_repo:
        type: string
        default: ''
        required: false
      cudaq_ref:
        type: string
        default: ''
        required: false

jobs:
  # Prove the decoders-only build environment: build the ubuntu:24.04
  # build-env image (docker/build_env/cudaqx.decoders.Dockerfile) from scratch,
  # then build the decoder stack with CUDAQ_QEC_DECODERS_ONLY=ON inside it. This
  # guards both the decoders-only CMake configuration (no CUDA-Q, no LLVM/MLIR,
  # no cuStabilizer) and the build-env image itself -- proving the decoders can
  # be built on a bare ubuntu with only the documented apt dependencies. The
  # image is a local tag, built and consumed on this runner only; nothing is
  # pushed. verify_build_env.sh runs the build and all assertions (decoding
  # server correctly skipped, standalone python decode with no cudaq import, no
  # CUDA-Q/LLVM linkage, and the opt-in TensorRT decoder plugin).
  decoders-only-build:
    name: Decoders-only build (CUDA ${{ matrix.cuda_version }}, TensorRT ${{ matrix.install_tensorrt }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # One run per platform. amd64 exercises the opt-in TensorRT path
        # (TensorRT resolves to a +cuda13 build, so pair it with 13.0); arm64
        # covers the default (no TensorRT, plugin auto-disabled).
        include:
          - { platform: amd64, cuda_version: '13.0', install_tensorrt: 'on' }
          - { platform: arm64, cuda_version: '13.0', install_tensorrt: 'off' }
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-qec') && format('linux-{0}-cpu8', matrix.platform) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Build decoders-only build-env image
        run: |
          docker build \
            -f docker/build_env/cudaqx.decoders.Dockerfile \
            --build-arg cuda_version=${{ matrix.cuda_version }} \
            --build-arg install_tensorrt=${{ matrix.install_tensorrt }} \
            -t cudaqx-decoders-build:ci .

      - name: Build decoders-only stack and verify
        run: |
          docker run --rm \
            -v "$PWD":/workspaces/cudaqx -w /workspaces/cudaqx \
            cudaqx-decoders-build:ci \
            bash .github/workflows/scripts/verify_build_env.sh ${{ matrix.install_tensorrt }}

  build-and-test:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        platform: ['amd64', 'arm64']
        cuda_version: ['12.6', '13.0']
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-qec') && format('linux-{0}-cpu8', matrix.platform) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/nvidia/cuda-quantum-devcontainer:${{ matrix.platform }}-cu${{ matrix.cuda_version }}-gcc12-main
      # SYS_NICE: the default seccomp profile only admits the NUMA memory-policy
      # syscalls (set_mempolicy/get_mempolicy/mbind) with this capability, which
      # the hardware-affinity tests exercise.
      options: --cap-add=SYS_NICE
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure
        id: config
        run: |
          cuda_major=`echo ${{ matrix.cuda_version }} | cut -d . -f1`
          echo "cuda_major=$cuda_major" >> $GITHUB_OUTPUT

      # ========================================================================
      # CUDA Quantum build
      # ========================================================================

      - name: Get required CUDAQ version
        id: get-cudaq-version
        uses: ./.github/actions/get-cudaq-version
        with:
          repo: ${{ inputs.cudaq_repo }}
          ref: ${{ inputs.cudaq_ref }}

      - name: Get CUDAQ build
        uses: ./.github/actions/get-cudaq-build
        with:
          repo: ${{ steps.get-cudaq-version.outputs.repo }}
          ref: ${{ steps.get-cudaq-version.outputs.ref }}
          token: ${{ secrets.CUDAQ_ACCESS_TOKEN }}
          cache-key-suffix: ${{ inputs.cache_key_suffix }}
          platform: ${{ matrix.platform }}-cu${{ steps.config.outputs.cuda_major }}

      # ========================================================================
      # Build library
      # ========================================================================
      - name: Install build requirements
        run: |
          apt update
          apt install -y --no-install-recommends wget jq

      - name: Install TensorRT (amd64)
        if: matrix.platform == 'amd64'
        run: |
          apt update
          apt-cache search tensorrt | awk '{print "Package: "$1"\nPin: version *+cuda${{ matrix.cuda_version }}\nPin-Priority: 1001\n"}' | tee /etc/apt/preferences.d/tensorrt-cuda${{ matrix.cuda_version }}.pref > /dev/null
          apt install -y tensorrt-dev

      - name: Install TensorRT (arm64)
        if: matrix.platform == 'arm64' && !startsWith(matrix.cuda_version, '12')
        run: |
          apt update
          apt-cache search tensorrt | awk '{print "Package: "$1"\nPin: version *+cuda13.0\nPin-Priority: 1001\n"}' | tee /etc/apt/preferences.d/tensorrt-cuda13.0.pref > /dev/null
          apt install -y tensorrt-dev

      - name: Build
        id: build
        uses: ./.github/actions/build-lib
        with:
          lib: "qec"
          cuda_version: ${{ matrix.cuda_version }}
          cache-key-suffix: ${{ inputs.cache_key_suffix }}
          save-ccache: true
          platform: ${{ matrix.platform }}
          cudaq-repo: ${{ steps.get-cudaq-version.outputs.repo }}
          cudaq-ref: ${{ steps.get-cudaq-version.outputs.ref }}
      # ========================================================================
      # Run tests
      # ========================================================================

      - name: Run tests
        run: cmake --build ${{ steps.build.outputs.build-dir }} --target run_tests

      # ========================================================================
      # Run python tests
      # ========================================================================
 
      - name: Install python requirements
        shell: bash
        run: |
          # Install the correct torch first.
          cuda_no_dot=$(echo ${{ matrix.cuda_version }} | sed 's/\.//')
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cu${cuda_no_dot}
          pip install numpy pytest onnxscript cuquantum-cu${{ steps.config.outputs.cuda_major }} quimb opt_einsum nvidia-cublas "cuquantum-python-cu${{ steps.config.outputs.cuda_major }}>=26.3.0"
          # The following tests are needed for docs/sphinx/examples/qec/python/tensor_network_decoder.py.
          if [ "$(uname -m)" == "x86_64" ]; then
              # Stim is not currently available on manylinux ARM wheels, so only
              # install for x86_64.
              pip install stim beliefmatching
          fi

      - name: Run Python tests
        run: cmake --build ${{ steps.build.outputs.build-dir }} --target run_python_tests

      # ========================================================================
      # Run example tests
      # ========================================================================

      - name: Run example tests
        run: bash scripts/ci/test_examples.sh qec

      # ========================================================================
      # Decoders-only build of the decoding server
      #
      # The decoders-only job above has no cudaq-realtime and so covers only
      # the not-found half of the gate. This job has one (the CUDA-Q install
      # is built with realtime), so use it for the found half: build the
      # server with CUDAQ_QEC_DECODERS_ONLY=ON and assert the dependency
      # contract that makes the mode worth having -- cudaq-realtime is a
      # separate product from CUDA-Q, so no CUDA-Q library may appear in the
      # binary. Run on one matrix entry only: the check is about link shape,
      # which does not vary by platform or CUDA version.
      # ========================================================================
      - name: Build the decoding server without CUDA-Q
        if: matrix.platform == 'amd64' && matrix.cuda_version == '13.0'
        run: |
          cmake -S libs/qec -B build_decoders_only_server \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUDAQ_QEC_DECODERS_ONLY=ON \
            -DCUDAQ_REALTIME_ROOT=/cudaq-install
          cmake --build build_decoders_only_server --target decoding_server -j$(nproc)

      - name: Check it links no CUDA-Q library, and starts
        if: matrix.platform == 'amd64' && matrix.cuda_version == '13.0'
        shell: bash
        run: |
          set -o pipefail
          server=build_decoders_only_server/bin/decoding_server
          needed=$(readelf -d "$server" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "$needed"
          # libcudaq-realtime is the point of the exercise; libcudaq-qec-* are
          # built right here. Anything else starting with libcudaq is CUDA-Q
          # leaking back in. Collect into a variable rather than piping into
          # `grep -q`: that short-circuits, and the pipeline then reports the
          # upstream status instead of the match, which makes the check
          # silently vacuous.
          offenders=$(echo "$needed" | grep '^libcudaq' \
            | grep -vE '^libcudaq-realtime\.so$|^libcudaq-qec-' || true)
          if [ -n "$offenders" ]; then
            echo "ERROR: decoding_server pulled in a CUDA-Q library:"
            echo "$offenders"
            exit 1
          fi
          cd build_decoders_only_server/bin
          ./decoding_server --config=decoding_server_config.yaml \
            --transport=udp --timeout=5 2>&1 | tee server.log
          grep -q QEC_DECODING_SERVER_READY server.log || {
            echo "ERROR: server never reported ready"
            exit 1
          }

      # ========================================================================
      # Realtime decoding demo example
      #
      # Build the two example binaries against the INSTALLED SDK -- this is what
      # enforces the installed-headers-only rule: a build-tree-only include
      # would fail to compile here. Then drive the delivered decoding_server
      # over UDP loopback with a real pymatching decode (the qpu-kernel source).
      # No hardware: the FPGA source needs a ConnectX NIC and is not run in CI.
      # ========================================================================
      - name: Build & run realtime_decoding_demo (qpu-kernel, UDP loopback)
        shell: bash
        run: |
          export PATH=/cudaq-install/bin:$PATH
          # Mirror build_qec.sh: it builds+installs cudaq-realtime to
          # $CUDAQ_REALTIME_ROOT, defaulting to /tmp/cudaq-realtime when unset
          # (the case for this workflow). Track the same value so this step
          # stays correct if the job ever sets CUDAQ_REALTIME_ROOT.
          RT="${CUDAQ_REALTIME_ROOT:-/tmp/cudaq-realtime}"
          EX=docs/sphinx/examples/qec/realtime_decoding_demo
          cmake -S "$EX" -B /tmp/rtdemo-build -G Ninja \
            -DCUDAQ_INSTALL_DIR=/cudaq-install \
            -DCUDAQX_INSTALL_DIR="$HOME/.cudaqx" \
            -DCUDAQ_REALTIME_DIR="$RT"
          cmake --build /tmp/rtdemo-build -j
          bash "$EX/run_realtime_decoding.sh" \
            --source qpu-kernel --decoder pymatching \
            --install-prefix "$HOME/.cudaqx" \
            --cudaq-prefix /cudaq-install \
            --realtime-lib-dir "$RT" \
            --example-build-dir /tmp/rtdemo-build

      # ========================================================================
      # Upload build artifacts for GPU tests
      # ========================================================================
      - name: Create artifact archive
        run: |
          tar czf /tmp/qec-build-artifacts.tar.gz \
            /cudaq-install \
            /tmp/cudaq-realtime \
            $GITHUB_WORKSPACE/libs/qec/unittests/decoders/realtime/data \
            $GITHUB_WORKSPACE/${{ steps.build.outputs.build-dir }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qec-build-${{ matrix.platform }}-cu${{ matrix.cuda_version }}
          path: /tmp/qec-build-artifacts.tar.gz
          retention-days: 1

  # ==========================================================================
  # GPU Tests - Run on GPU runners (uses build artifacts from build-and-test)
  # ==========================================================================
  gpu-test:
    name: GPU tests
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        platform: ['amd64', 'arm64']
        cuda_version: ['12.6', '13.0']
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-qec') && format('linux-{0}-gpu-a100-latest-1', matrix.platform) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/nvidia/cuda-quantum-devcontainer:${{ matrix.platform }}-cu${{ matrix.cuda_version }}-gcc12-main
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Install git for LFS
        shell: bash
        run: |
          apt update
          apt install -y --no-install-recommends git git-lfs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          lfs: true # download assets file(s) for TRT tests

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qec-build-${{ matrix.platform }}-cu${{ matrix.cuda_version }}
          path: /tmp

      - name: Extract build artifacts
        run: |
          tar xzf /tmp/qec-build-artifacts.tar.gz -C /

      - name: Configure
        id: config
        run: |
          cuda_major=$(echo ${{ matrix.cuda_version }} | cut -d . -f1)
          echo "cuda_major=$cuda_major" >> $GITHUB_OUTPUT

      - name: Install cuStabilizer runtime
        run: |
          pip install --upgrade "cuquantum-python-cu${{ steps.config.outputs.cuda_major }}>=26.3.0"

      - name: Install TensorRT (C++, amd64)
        if: matrix.platform == 'amd64'
        run: |
          apt update
          apt-cache search tensorrt | awk '{print "Package: "$1"\nPin: version *+cuda${{ matrix.cuda_version }}\nPin-Priority: 1001\n"}' | tee /etc/apt/preferences.d/tensorrt-cuda${{ matrix.cuda_version }}.pref > /dev/null
          apt install -y tensorrt-dev

      - name: Install TensorRT (C++, arm64)
        if: matrix.platform == 'arm64' && !startsWith(matrix.cuda_version, '12')
        run: |
          apt update
          apt-cache search tensorrt | awk '{print "Package: "$1"\nPin: version *+cuda13.0\nPin-Priority: 1001\n"}' | tee /etc/apt/preferences.d/tensorrt-cuda13.0.pref > /dev/null
          apt install -y tensorrt-dev

      - name: Install TensorRT (Python)
        if: matrix.platform != 'arm64' || !startsWith(matrix.cuda_version, '12')
        run: |
          pip install "tensorrt-cu${{ steps.config.outputs.cuda_major }}==10.13.*" "cuda_toolkit[cudart]==${{ matrix.cuda_version }}.*"

      - name: Install Python GPU test requirements
        run: |
          cuda_no_dot=$(echo ${{ matrix.cuda_version }} | sed 's/\.//')
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cu${cuda_no_dot}
          pip install numpy pytest cuquantum-cu${{ steps.config.outputs.cuda_major }} quimb opt_einsum nvidia-cublas "cuquantum-python-cu${{ steps.config.outputs.cuda_major }}>=26.3.0" "custabilizer-cu${{ steps.config.outputs.cuda_major }}>=0.3.0"

      - name: Run GPU C++ tests
        run: |
          cd $GITHUB_WORKSPACE/build_qec
          ctest --output-on-failure -R "GpuKernelsTest|test_realtime_decoding|test_realtime_pipeline|test_ai_decoder_quantized_onnx|DemSamplingGPU|TRTDecoder"

      - name: Run GPU Python tests
        run: |
          PYTHONPATH="/cudaq-install:$GITHUB_WORKSPACE/build_qec/python" \
            pytest -v libs/qec/python/tests/

  # ==========================================================================
  # Multi-GPU tests - decoder placement across >= 2 GPUs (uses build artifacts
  # from build-and-test).
  #
  # Keep this lane on the ARM L4 2-GPU runner while amd64 2-GPU runner
  # availability is too limited for PR CI. The runner metadata remains
  # structured so artifact and container selection stay arch-driven. Run CUDA
  # 13.0 only because the ARM CUDA 12.6 lane does not support TensorRT.
  # ==========================================================================
  multi-gpu-test:
    name: Multi-GPU tests (${{ matrix.runner.arch }}, CUDA ${{ matrix.cuda_version }})
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: arm64
            label: linux-arm64-gpu-l4-latest-2
        cuda_version: ['13.0']
    runs-on: ${{ matrix.runner.label }}
    container:
      image: ghcr.io/nvidia/cuda-quantum-devcontainer:${{ matrix.runner.arch }}-cu${{ matrix.cuda_version }}-gcc12-main
      # SYS_NICE: see build-and-test.
      options: --cap-add=SYS_NICE
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Install git for LFS
        shell: bash
        run: |
          apt update
          apt install -y --no-install-recommends git git-lfs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          lfs: true # TRT tests read the ONNX asset from the source tree

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qec-build-${{ matrix.runner.arch }}-cu${{ matrix.cuda_version }}
          path: /tmp

      - name: Extract build artifacts
        run: |
          tar xzf /tmp/qec-build-artifacts.tar.gz -C /

      - name: Configure
        id: config
        run: |
          cuda_major=$(echo ${{ matrix.cuda_version }} | cut -d . -f1)
          echo "cuda_major=$cuda_major" >> $GITHUB_OUTPUT

      - name: Install cuStabilizer runtime
        run: |
          pip install --upgrade "cuquantum-python-cu${{ steps.config.outputs.cuda_major }}>=26.3.0"

      - name: Install TensorRT (C++, arm64)
        if: matrix.runner.arch == 'arm64' && !startsWith(matrix.cuda_version, '12')
        run: |
          apt update
          apt-cache search tensorrt | awk '{print "Package: "$1"\nPin: version *+cuda13.0\nPin-Priority: 1001\n"}' | tee /etc/apt/preferences.d/tensorrt-cuda13.0.pref > /dev/null
          apt install -y tensorrt-dev

      - name: Run multi-GPU C++ tests
        run: |
          cd $GITHUB_WORKSPACE/build_qec
          # The matching tests will be added separately; until then, this
          # command should not fail solely because the filter finds no tests.
          ctest --output-on-failure \
            -R "DecoderPool|HardwarePinningGpu|PoolRunsTwoTrt|CudaDeviceId"
