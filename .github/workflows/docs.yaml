name: Documentation

on:
  workflow_call:
    inputs:
      deploy_docs:
        type: boolean
        default: false
        required: false
      docs_version:
        type: string
        default: ''
        required: false
      cache_key_suffix:
        type: string
        default: ''
        required: false
      cudaq_repo:
        type: string
        default: ''
        required: false
      cudaq_ref:
        type: string
        default: ''
        required: false
  workflow_dispatch:
    inputs:
      deploy_docs:
        description: 'Deploy docs to GitHub Pages. Deployment only runs on releases/vX.Y.Z branches.'
        type: boolean
        default: false
        required: false
      docs_version:
        description: >-
          Docs version to build/publish (e.g. 0.6.0). If left empty, it is derived
          from the branch name (releases/vX.Y.Z -> X.Y.Z, otherwise "latest").
        type: string
        default: ''
        required: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docs.yaml'
      - 'docs/**'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      container: ${{ steps.set-container.outputs.container }}
    steps:
      - name: Set docs version
        id: set-version
        run: |
          version="${{ inputs.docs_version }}"
          if [[ -z "$version" ]]; then
            if [[ "$GITHUB_REF" =~ ^refs/heads/releases/v(.+)$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              version="latest"
            fi
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set container image
        id: set-container
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/heads/releases/v(.+)$ ]]; then
            echo "container=ghcr.io/nvidia/cudaqx-dev:${BASH_REMATCH[1]}-amd64-cu12.6" >> $GITHUB_OUTPUT
          else
            echo "container=ghcr.io/nvidia/cudaqx-dev:latest-amd64-cu12.6" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    needs: setup
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-qec') && 'linux-amd64-cpu8' || 'ubuntu-latest' }}
    container: ${{ needs.setup.outputs.container }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
          lfs: true

      # ========================================================================
      # CUDA Quantum build
      # ========================================================================

      - name: Get required CUDAQ version
        id: get-cudaq-version
        uses: ./.github/actions/get-cudaq-version
        with:
          repo: ${{ inputs.cudaq_repo }}
          ref: ${{ inputs.cudaq_ref }}

      - name: Get CUDAQ build
        uses: ./.github/actions/get-cudaq-build
        with:
          repo: ${{ steps.get-cudaq-version.outputs.repo }}
          ref: ${{ steps.get-cudaq-version.outputs.ref }}
          token: ${{ secrets.CUDAQ_ACCESS_TOKEN }}
          cache-key-suffix: ${{ inputs.cache_key_suffix }}
          platform: 'amd64-cu12' # Just choose one platform for docs

      # ========================================================================
      # Build docs
      # ========================================================================

      - name: Install requirements
        run: |
          apt update
          apt install -y --no-install-recommends doxygen

          python3 -m pip install IPython breathe enum_tools myst_parser nbsphinx \
            sphinx_copybutton sphinx_inline_tabs sphinx_gallery sphinx_rtd_theme \
            sphinx_reredirects "sphinx<9" sphinx_toolbox \
            "cuquantum-python-cu12>=26.3.0"

      - name: Build docs
        env:
          CUDAQX_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # Note: TRT decoder is disabled because all docs for the TRT decoder
          # are generated independently of the source code (no Doxygen
          # documentation).
          cmake -S . -B "build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCUDAQ_DIR=/cudaq-install/lib/cmake/cudaq/ \
            -DCUDAQX_ENABLE_LIBS="all" \
            -DCUDAQX_INCLUDE_DOCS=ON \
            -DCUDAQX_BINDINGS_PYTHON=ON \
            -DCUDAQ_QEC_BUILD_TRT_DECODER=OFF

          cmake --build "build" --target docs

      # ========================================================================

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/docs/build/
          retention-days: 7

  deploy:
    name: Deploy docs (${{ needs.setup.outputs.version }})
    # Only release versions are published; docs built from main (version
    # "latest") are build-tested but never deployed.
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_docs == true &&
      startsWith(github.ref, 'refs/heads/releases/v') &&
      needs.setup.outputs.version != 'latest'
    # The versioned site is assembled on the gh-pages branch; serialize
    # deployments so concurrent runs from different branches cannot race.
    concurrency:
      group: docs-deploy-gh-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    needs: [setup, build]
    steps:
      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs-html

      - name: Update versioned site on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          git config --global user.name "cudaqx-bot"
          git config --global user.email "cudaqx-bot@users.noreply.github.com"

          # The gh-pages branch holds the assembled site (one directory per
          # version) and is expected to exist.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch gh-pages "$remote" site

          # Replace this version's directory with the fresh build.
          rm -rf "site/${DOCS_VERSION}"
          cp -r docs-html "site/${DOCS_VERSION}"

          cd site

          # Mirror the newest release at the site root so that unversioned
          # links (https://nvidia.github.io/cudaqx/...) keep working and
          # always show the most recent release: remove everything except the
          # version directories and housekeeping files, then copy the newest
          # release's tree in.
          newest=$(ls -d [0-9]*/ | sort -V | tail -1)
          find . -maxdepth 1 ! -name . ! -name '.git' ! -name '.nojekyll' ! -name '[0-9]*' -exec rm -rf {} +
          cp -r "${newest}." ./

          # Regenerate the manifest consumed by the sidebar version selector
          # (docs/sphinx/_static/version-switcher.js).
          {
            printf '{"latest": "%s", "versions": [' "${newest%/}"
            ls -d [0-9]*/ | sort -rV | sed 's|/$||; s|.*|"&"|' | paste -sd, -
            printf ']}\n'
          } > versions.json

          git add -A
          if git commit -m "Deploy ${DOCS_VERSION} docs from ${GITHUB_SHA}"; then
            git push origin gh-pages
          else
            echo "Site already up to date; nothing to push"
          fi

          # The .git directory must not end up in the published site.
          rm -rf .git

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
