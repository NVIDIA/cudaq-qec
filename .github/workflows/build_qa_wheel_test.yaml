name: Build Image for QA Wheel Tests

on:
  workflow_dispatch:
    inputs:
      wheels_repo:
        type: string
        description: Retrieve assets from a GitHub Actions run in this repo (e.g. NVIDIA/cudaq-qec)
        required: true
      wheels_run_id:
        type: string
        description: Retrieve wheels from this GitHub Actions run (e.g. 14368511401)
        required: true
      cudaq_repo:
        type: string
        description: Retrieve CUDA-Q from this repo (e.g. NVIDIA/cuda-quantum)
        required: false
      cudaq_assets_tag:
        type: string
        description: Retrieve CUDA-Q assets from this release (e.g. 0.11.0). Mutually exclusive with use_custom_cudaq_wheels.
        required: false
      use_custom_cudaq_wheels:
        type: boolean
        description: Instead of a CUDA-Q release, use the custom-built CUDA-Q wheels (cudaq-wheels-* artifacts) from the wheels_run_id run itself (requires that run to have been built with cudaq_wheels=Custom). Use when no CUDA-Q release exists yet to pull from. Mutually exclusive with cudaq_assets_tag.
        default: false
        required: false

jobs:
  build-img:
    name: Build Image for QA Wheel Tests 
    runs-on: linux-amd64-cpu8
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up context for buildx
        run: |
          docker context create builder_context

      - name: Set up buildx runner
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builder_context
          version: v0.19.0
          driver-opts: |
            network=host
            image=moby/buildkit:v0.19.0
          buildkitd-config: /etc/buildkit/buildkitd.toml # hardcoded for NVIDIA runner

      - name: Log in to GitHub CR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.PACKAGE_USER || github.actor }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      # Do this early to help validate user inputs (if present)
      - name: Fetch assets
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        id: fetch-assets
        run: |
          mkdir wheels && cd wheels
          # TODO - make this more generic by accepting repos as inputs. However,
          # note that this process changes from release to release.
          # Fetch the cuQuantum assets
          # gh release download -R NVIDIA/cudaq-private cuquantum-25.03 -p '*cu12*.whl'
          # Fetch the CUDA-Q wheels
          # gh release download -R NVIDIA/cudaq-private staging-0.10.0 -p '*cu12*.whl'
          if [[ -n "${{ inputs.cudaq_assets_tag }}" ]] && [[ "${{ inputs.use_custom_cudaq_wheels }}" == "true" ]]; then
            echo "::error::cudaq_assets_tag and use_custom_cudaq_wheels are mutually exclusive; provide only one CUDA-Q wheel source."
            exit 1
          fi
          if [[ -n "${{ inputs.cudaq_assets_tag }}" ]]; then
            gh release download -R ${{ inputs.cudaq_repo }} ${{ inputs.cudaq_assets_tag }} -p 'wheelhouse-*.zip'
            for f in wheelhouse-*.zip; do unzip $f; done
            mv wheelhouse-*/*.whl .
          elif [[ "${{ inputs.use_custom_cudaq_wheels }}" == "true" ]]; then
            # Use the custom-built CUDA-Q wheels (cudaq-wheels-<platform>-cu<major>
            # artifacts) produced by the same "Build wheels" run as the CUDA-QX
            # wheels, when no CUDA-Q release exists yet to pull from. The blanket
            # `mv */*.whl .` below moves these into place along with the CUDA-QX
            # wheels.
            gh run download -R ${{ inputs.wheels_repo }} ${{ inputs.wheels_run_id }} -p 'cudaq-wheels-*'
          fi

          # Fetch the CUDA-QX wheels
          gh run download -R ${{ inputs.wheels_repo }} ${{ inputs.wheels_run_id }} -p 'wheels-py*'
          gh run download -R ${{ inputs.wheels_repo }} ${{ inputs.wheels_run_id }} -p 'metapackages'
          mv */*.whl .
          mv metapackages/*.tar.gz .
          ls
        shell: bash

      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/release/Dockerfile.wheel
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/nvidia/private/cudaqx-private-wheels-test:latest
          platforms: linux/amd64,linux/arm64
          push: true
