name: PR sanity checks

on:
  pull_request:
    branches: 
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 22

permissions:
  contents: read

jobs:
  check-changes:
    name: Check changes
    runs-on: ubuntu-24.04
    outputs:
      check-cpp: ${{ steps.filter.outputs.check-cpp }}
      check-all-cpp: ${{ steps.filter.outputs.check-all-cpp }}
      check-python: ${{ steps.filter.outputs.check-python }}
      check-all-python: ${{ steps.filter.outputs.check-all-python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Check what needs testing
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            check-all-cpp:
              - '.github/workflows/pr_sanity_checks.yaml'
              - '.clang-format'
            check-cpp:
              - '**/*.c'
              - '**/*.h'
              - '**/*.cpp'
              - '**/*.hpp'
              - '**/*.cc'
              - '**/*.hh'
              - '**/*.cxx'
              - '**/*.cu'
              - '**/*.cuh'
            check-all-python:
              - '.github/workflows/pr_sanity_checks.yaml'
              - '.style.yapf'
            check-python:
              - '**/*.py'

  check-cpp:
    name: Check C++ code formatting
    needs: [check-changes]
    if: needs.check-changes.outputs.check-cpp == 'true' || needs.check-changes.outputs.check-all-cpp == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Install clang-format
        run: |
          # Requirements
          sudo apt-get update
          sudo apt-get install -y wget software-properties-common gpg

          # Obtain VERSION_CODENAME and UBUNTU_CODENAME
          source /etc/os-release

          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb http://apt.llvm.org/${UBUNTU_CODENAME}/  llvm-toolchain-${UBUNTU_CODENAME}-${LLVM_VERSION} main"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-${LLVM_VERSION}

          # The Ubuntu base image provided by GitHub Actions has the wrong
          # clang-format. We install the right one here.  This is important
          # because the "git clang-format-16" command will use still attempt to
          # use clang-format.
          sudo rm /usr/bin/clang-format
          sudo ln -s /usr/bin/clang-format-${LLVM_VERSION} /usr/bin/clang-format

      # If the `clang-format` file changes, we require the reformatting of all
      # files. See https://github.com/NVIDIA/cudaq-qec/pull/15#discussion_r1868174072
      - name: clang-format all things
        if: needs.check-changes.outputs.check-all-cpp == 'true'
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.hpp' '*.cc' '*.hh' '*.cxx' '*.hxx' '*.cu' '*.cuh' | xargs clang-format-${LLVM_VERSION} -i

          if ! git diff --exit-code; then
            git diff --ignore-submodules > clang-format.patch
            echo "🟥 Clang-format found formatting problems (check the uploaded artifact)." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "🟩 Clang-format found no formatting problems" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: clang-format changed files
        if: needs.check-changes.outputs.check-all-cpp != 'true'
        run: |
          # We did a shallow clone, and thus we need to make sure to fetch the base
          # commit.
          git fetch --recurse-submodules=no origin ${{ github.base_ref }}
          DIFF_COMMIT_SHA=$(git rev-parse origin/${{ github.base_ref }})

          if ! git clang-format-$LLVM_VERSION $DIFF_COMMIT_SHA; then
            git diff --ignore-submodules > clang-format.patch
            echo "🟥 Clang-format found formatting problems (check the uploaded artifact)." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "🟩 Clang-format found no formatting problems" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Upload format patch
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ failure() }}
        with:
          name: clang-format-patch
          path: clang-*.patch
          retention-days: 14

  check-python:
    name: Check Python code formatting
    needs: [check-changes]
    if: needs.check-changes.outputs.check-python == 'true' || needs.check-changes.outputs.check-all-python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install YAPF
        run: pip install yapf

      - name: YAPF all things
        if: needs.check-changes.outputs.check-all-python == 'true'
        run: |
          git ls-files '*.py' | xargs yapf -i

          if ! git diff --exit-code; then
            git diff --ignore-submodules > yapf-format.patch
            echo "🟥 YAPF found formatting problems (check the uploaded artifact)." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "🟩 YAPF found no formatting problems" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: YAPF changed files
        if: needs.check-changes.outputs.check-all-python != 'true'
        run: |
          # We did a shallow clone, and thus we need to make sure to fetch the base
          # commit.
          git fetch --recurse-submodules=no origin ${{ github.base_ref }}
          DIFF_COMMIT_SHA=$(git rev-parse origin/${{ github.base_ref }})

          git diff --diff-filter=d $DIFF_COMMIT_SHA -- '*.py' | yapf-diff -i

          if ! git diff --exit-code; then
            git diff --ignore-submodules > yapf-format.patch
            echo "🟥 YAPF found formatting problems (check the uploaded artifact)." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "🟩 YAPF found no formatting problems" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Upload format patch
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ failure() }}
        with:
          name: yapf-format-patch
          path: yapf-*.patch
          retention-days: 14

  check-license-headers:
    name: Check license headers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Determine changed files
        id: changed-files
        run: |
          # We did a shallow clone, and thus we need to make sure to fetch the base
          # commit.
          git fetch --recurse-submodules=no origin ${{ github.base_ref }}
          BASE_SHA=$(git rev-parse origin/${{ github.base_ref }})

          git diff --diff-filter=d --name-only "$BASE_SHA" -- . > changed_files.txt

          if [ -s changed_files.txt ]; then
            echo "has-files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-files=false" >> "$GITHUB_OUTPUT"
          fi

      # license-eye only takes a `paths` glob list via its config file, so we
      # generate a copy of .licenserc.yaml scoped to just this PR's changed
      # files. This means the check only enforces correct headers on new/
      # modified files, not on the whole (currently inconsistent) repo.
      - name: Scope license config to changed files
        if: steps.changed-files.outputs.has-files == 'true'
        run: |
          python3 - <<'PYEOF'
          with open('.licenserc.yaml') as f:
              content = f.read()
          with open('changed_files.txt') as f:
              files = [line.strip() for line in f if line.strip()]

          paths_yaml = '\n'.join(
              "    - '{}'".format(f.replace("'", "''")) for f in files
          )
          old_block = "  paths:\n    - '**'"
          new_block = "  paths:\n" + paths_yaml
          if old_block not in content:
              raise SystemExit(
                  "Expected 'paths:' block not found in .licenserc.yaml; "
                  "update this workflow step if that file's structure changed."
              )
          content = content.replace(old_block, new_block, 1)

          with open('.licenserc.pr.yaml', 'w') as f:
              f.write(content)
          PYEOF

      - name: Setup Go
        if: steps.changed-files.outputs.has-files == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install license-eye
        if: steps.changed-files.outputs.has-files == 'true'
        run: go install github.com/apache/skywalking-eyes/cmd/license-eye@v0.8.0

      - name: Run license header check
        if: steps.changed-files.outputs.has-files == 'true'
        run: |
          EXIT_CODE=0
          "$(go env GOPATH)/bin/license-eye" -c .licenserc.pr.yaml header check || EXIT_CODE=$?

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "🟥 License header check failed (see log above)." >> $GITHUB_STEP_SUMMARY
            echo
            echo "Each file listed above must carry a header matching this (see .licenserc.yaml):"
            echo "---"
            sed -n '/^    content: |/,/^    pattern: |/p' .licenserc.yaml | sed '1d;$d' | sed 's/^      //'
            echo "---"
          else
            echo "🟩 License header check passed" >> $GITHUB_STEP_SUMMARY
          fi
          exit $EXIT_CODE

  # This job is used for branch protection checks.
  verify:
    name: Sanity check PR
    if: ${{ always() }}
    needs:
      - check-cpp
      - check-python
      - check-license-headers
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          status="success"

          check_result() {
            name=$1
            result=$2

            # NOTE: "skipped" is considered success.
            if [[  "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "$name job failed"

              status="failed"
            fi
          }

          check_result "check-cpp"             "${{needs.check-cpp.result}}"
          check_result "check-python"          "${{needs.check-python.result}}"
          check_result "check-license-headers" "${{needs.check-license-headers.result}}"

          if [[ "$status" != "success" ]]; then
            exit 1
          fi
