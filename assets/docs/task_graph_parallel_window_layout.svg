<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
  <title>Parallel-window layout: A windows commit 3 rounds between 3-round buffers; B windows commit the 9-round gaps between them</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- Legend -->
  <g font-size="12" fill="#1a1a1a">
    <rect x="80" y="12" width="26" height="14" fill="#76b900" stroke="#5a8f00"/>
    <text x="112" y="24">commit zone: the rounds a window corrects</text>
    <rect x="400" y="12" width="26" height="14" fill="#e4f2c7" stroke="#76b900" stroke-dasharray="4 3"/>
    <text x="432" y="24">buffer: context only</text>
  </g>

  <!-- Parameter labels over A[1], staggered so they do not run together -->
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="353" y="44">buffer_rounds</text>
    <text x="431" y="58">commit_rounds</text>
    <text x="509" y="44">buffer_rounds</text>
  </g>

  <!-- Layer labels -->
  <g font-size="13" font-weight="bold" fill="#1a1a1a">
    <text x="20" y="92">layer A</text>
    <text x="20" y="172">layer B</text>
  </g>

  <!-- Layer A: buffer | commit | buffer, every 12 rounds -->
  <g stroke="#76b900" stroke-dasharray="4 3" fill="#e4f2c7">
    <rect x="158" y="70" width="78" height="34"/>
    <rect x="314" y="70" width="78" height="34"/>
    <rect x="470" y="70" width="78" height="34"/>
    <rect x="626" y="70" width="78" height="34"/>
    <rect x="782" y="70" width="78" height="34"/>
  </g>
  <g fill="#76b900" stroke="#5a8f00">
    <rect x="80" y="70" width="78" height="34"/>
    <rect x="392" y="70" width="78" height="34"/>
    <rect x="704" y="70" width="78" height="34"/>
  </g>
  <g font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <text x="119" y="92">A[0]</text>
    <text x="431" y="92">A[1]</text>
    <text x="743" y="92">A[2]</text>
  </g>

  <!-- Layer B: commits the gaps -->
  <g fill="#4f8fd6" stroke="#2f6fb6">
    <rect x="158" y="150" width="234" height="34"/>
    <rect x="470" y="150" width="234" height="34"/>
    <rect x="782" y="150" width="78" height="34"/>
  </g>
  <g font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <text x="275" y="172">B[1]</text>
    <text x="587" y="172">B[2]</text>
    <text x="821" y="172">B[3] …</text>
  </g>
  <text x="587" y="200" font-size="11" fill="#555" text-anchor="middle">gap_rounds</text>

  <!-- Hand-offs into B[2] -->
  <g fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M483,104 L483,148"/>
    <path d="M717,104 L695,148"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="489" y="131">forward</text>
    <text x="711" y="131" text-anchor="end">backward</text>
  </g>

  <!-- Round axis -->
  <g stroke="#888" stroke-width="1">
    <line x1="80" y1="215" x2="860" y2="215"/>
    <line x1="80" y1="211" x2="80" y2="219"/>
    <line x1="158" y1="211" x2="158" y2="219"/>
    <line x1="236" y1="211" x2="236" y2="219"/>
    <line x1="314" y1="211" x2="314" y2="219"/>
    <line x1="392" y1="211" x2="392" y2="219"/>
    <line x1="470" y1="211" x2="470" y2="219"/>
    <line x1="548" y1="211" x2="548" y2="219"/>
    <line x1="626" y1="211" x2="626" y2="219"/>
    <line x1="704" y1="211" x2="704" y2="219"/>
    <line x1="782" y1="211" x2="782" y2="219"/>
    <line x1="860" y1="211" x2="860" y2="219"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="80" y="232">0</text>
    <text x="158" y="232">3</text>
    <text x="236" y="232">6</text>
    <text x="314" y="232">9</text>
    <text x="392" y="232">12</text>
    <text x="470" y="232">15</text>
    <text x="548" y="232">18</text>
    <text x="626" y="232">21</text>
    <text x="704" y="232">24</text>
    <text x="782" y="232">27</text>
    <text x="860" y="232">30</text>
  </g>
  <text x="20" y="232" font-size="12" fill="#555">round</text>

  <!-- Period -->
  <g stroke="#555" stroke-width="1">
    <line x1="392" y1="258" x2="704" y2="258"/>
    <line x1="392" y1="252" x2="392" y2="264"/>
    <line x1="704" y1="252" x2="704" y2="264"/>
  </g>
  <text x="548" y="282" font-size="12" fill="#1a1a1a" text-anchor="middle">period: commit_rounds + gap_rounds = 12 rounds</text>
</svg>
