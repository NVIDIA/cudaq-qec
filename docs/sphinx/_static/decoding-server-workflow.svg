<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Prepare a configuration, then run decoding shots</title>
  <desc id="description">Before an experiment, use the memory-experiment generator for supported surface-code A/B graphs, or prepare circuit-specific YAML for other experiments. Load that YAML into the decoding server and wait for READY. During each shot, an application or playback client sends reset, measurements and correction requests. For the generated A/B configuration, send BULK rounds followed by FINAL readout. The server runs the selected decoder or task graph and returns logical correction bits; the application interprets or applies them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52645a"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #203329; text-anchor: middle; font-size: 20px; }
    .heading { font-size: 23px; font-weight: bold; text-anchor: start; }
    .label { font-size: 17px; }
    .edge-label { font-size: 17px; text-anchor: start; }
    .node { fill: #f2f6f3; stroke: #7b8d81; stroke-width: 1.5; }
    .configured { fill: #edf6df; stroke: #4e7829; stroke-width: 1.5; }
    .edge { fill: none; stroke: #52645a; stroke-width: 2; marker-end: url(#arrow); }
    .divider { stroke: #ccd6cf; stroke-width: 1; }
  </style>
  <rect width="800" height="600" rx="8" fill="#ffffff"/>

  <text class="heading" x="24" y="31">1. Prepare before the experiment</text>
  <rect class="node" x="24" y="56" width="348" height="92" rx="8"/>
  <text x="198" y="86">Surface-code memory / A/B</text>
  <text class="label" x="198" y="118">memory-experiment-generator</text>
  <rect class="node" x="428" y="56" width="348" height="92" rx="8"/>
  <text x="602" y="86">Other supported experiments</text>
  <text class="label" x="602" y="118">Prepare circuit-specific configuration</text>
  <path class="edge" d="M 198 148 V 176 H 400 V 199"/>
  <path class="edge" d="M 602 148 V 176 H 400 V 199"/>
  <rect class="configured" x="268" y="200" width="264" height="64" rx="8"/>
  <text x="400" y="239">Decoder YAML</text>
  <path class="edge" d="M 532 232 H 626 V 389"/>
  <text class="edge-label" x="646" y="294">--config</text>
  <text class="edge-label" x="646" y="318">Wait for READY</text>

  <line class="divider" x1="24" y1="335" x2="776" y2="335"/>
  <text class="heading" x="24" y="369">2. Run each shot</text>
  <rect class="node" x="24" y="390" width="300" height="110" rx="8"/>
  <text x="174" y="422">Application / playback</text>
  <text class="label" x="174" y="453">Sends measurements</text>
  <text class="label" x="174" y="480">Uses returned corrections</text>
  <rect class="configured" x="476" y="390" width="300" height="110" rx="8"/>
  <text x="626" y="422">Decoding server</text>
  <text class="label" x="626" y="453">Selected decoder</text>
  <text class="label" x="626" y="480">or A/B task graph</text>
  <path class="edge" d="M 324 428 H 475"/>
  <text class="label" x="400" y="418">Requests</text>
  <path class="edge" d="M 476 478 H 325"/>
  <text class="label" x="400" y="467">Corrections</text>
  <rect class="node" x="24" y="548" width="300" height="36" rx="6"/>
  <text class="label" x="174" y="572">QPU / simulator / recorded data</text>
  <path class="edge" d="M 174 548 V 501"/>
  <text class="label" x="626" y="549">Generated A/B shot:</text>
  <text class="label" x="626" y="578">reset → BULK → FINAL → read</text>
</svg>
